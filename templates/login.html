<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - VAPT Automation Tool</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, Helvetica, sans-serif;
            background:
                radial-gradient(circle at top, #18243d 0%, #0b1220 45%, #050912 100%);
            color: #e5e7eb;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            padding: 24px;
        }

        .login-card {
            background: rgba(15, 23, 42, 0.96);
            border: 1px solid #26334d;
            border-radius: 16px;
            padding: 36px;
            box-shadow: 0 24px 70px rgba(0, 0, 0, 0.45);
        }

        .logo {
            width: 58px;
            height: 58px;
            margin: 0 auto 20px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #2563eb;
            font-size: 25px;
            font-weight: bold;
        }

        h1 {
            margin: 0;
            text-align: center;
            font-size: 25px;
        }

        .subtitle {
            margin: 8px 0 28px;
            text-align: center;
            color: #94a3b8;
            font-size: 14px;
        }

        label {
            display: block;
            margin: 18px 0 7px;
            font-size: 13px;
            font-weight: 600;
            color: #cbd5e1;
        }

        input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #334155;
            border-radius: 9px;
            background: #0b1220;
            color: #f8fafc;
            outline: none;
            font-size: 15px;
        }

        input:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
        }

        button {
            width: 100%;
            margin-top: 26px;
            padding: 13px;
            border: 0;
            border-radius: 9px;
            background: #2563eb;
            color: white;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .error {
            margin-bottom: 18px;
            padding: 11px 13px;
            border-radius: 8px;
            border: 1px solid #7f1d1d;
            background: #450a0a;
            color: #fecaca;
            font-size: 13px;
        }

        .footer {
            margin-top: 22px;
            text-align: center;
            color: #64748b;
            font-size: 12px;
        }
    </style>
</head>

<body>

<div class="login-container">
    <div class="login-card">

        <div class="logo">V</div>

        <h1>VAPT Automation Tool</h1>

        <div class="subtitle">
            Secure Dashboard Login
        </div>

        {% if error %}
        <div class="error">
            {{ error }}
        </div>
        {% endif %}

        <form method="POST" action="{{ url_for('login', next=request.args.get('next', '/')) }}">

            <label for="username">
                Username
            </label>

            <input
                id="username"
                name="username"
                type="text"
                autocomplete="username"
                required
                autofocus
            >

            <label for="password">
                Password
            </label>

            <input
                id="password"
                name="password"
                type="password"
                autocomplete="current-password"
                required
            >

            <button type="submit">
                Sign In
            </button>

        </form>

        <div class="footer">
            Authorized users only
        </div>

    </div>
</div>

</body>
</html>
